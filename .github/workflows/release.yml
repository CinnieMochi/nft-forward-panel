name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PANEL_SECRET_KEY: github-actions-test-secret
          PANEL_ADMIN_USERNAME: admin
          PANEL_ADMIN_PASSWORD: GitHubActionsOnly2026
          PANEL_COOKIE_SECURE: "0"
        run: |
          export PANEL_DATA_DIR="$(mktemp -d)"
          trap 'rm -rf "$PANEL_DATA_DIR"' EXIT
          PYTHONPATH=. python -m unittest discover -s tests -v

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Build release archive and checksum
        run: |
          mkdir -p dist/nft-forward-panel
          rsync -a ./ dist/nft-forward-panel/ \
            --exclude .git --exclude .github --exclude dist \
            --exclude .venv --exclude .preview-data \
            --exclude __pycache__ --exclude '*.pyc' --exclude '*.db*'
          tar -C dist -czf dist/nft-forward-panel.tar.gz nft-forward-panel
          cd dist
          sha256sum nft-forward-panel.tar.gz > nft-forward-panel.tar.gz.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: |
            dist/nft-forward-panel.tar.gz
            dist/nft-forward-panel.tar.gz.sha256
          generate_release_notes: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nft-forward-panel-${{ github.sha }}
          path: |
            dist/nft-forward-panel.tar.gz
            dist/nft-forward-panel.tar.gz.sha256
